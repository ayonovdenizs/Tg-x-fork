name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle assemble task"
        required: true
        default: "assembleLatestArm64Release"
        type: choice
        options:
          - assembleLatestArm64Release
          - assembleLatestUniversalRelease
          - assembleLatestArm64Debug
          - assembleLatestUniversalDebug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rebranding — override via repository "Variables" (Settings → Secrets and variables → Actions → Variables)
  APP_ID: ${{ vars.APP_ID || 'org.ayonovdenizs.tgx' }}
  APP_NAME: ${{ vars.APP_NAME || 'Telegram X Ghost' }}
  APP_DOWNLOAD_URL: ${{ vars.APP_DOWNLOAD_URL || format('https://github.com/{0}/releases', github.repository) }}
  APP_SOURCES_URL: ${{ format('https://github.com/{0}', github.repository) }}
  # Telegram API credentials — https://core.telegram.org/api/obtaining_api_id
  # Store them in repository "Secrets". Falls back to the sample credentials from local.properties.sample.
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo apt-get clean
          df -h

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          lfs: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs make yasm nasm cmake ninja-build

      - name: Set up Android SDK / NDK
        run: |
          export TERM=xterm
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$PWD/scripts:$PATH"
          chmod +x scripts/*.sh gradlew
          scripts/setup-sdk.sh

      - name: Prepare keystore
        run: |
          # If KEYSTORE_BASE64 secret is provided, use it; otherwise fall back to the committed test keystore.
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            cat > release.keystore.properties <<EOF
          keystore.file: release.keystore
          keystore.password: ${{ secrets.KEYSTORE_PASSWORD }}
          key.alias: ${{ secrets.KEY_ALIAS }}
          key.password: ${{ secrets.KEY_PASSWORD }}
          EOF
            echo "KEYSTORE_FILE=release.keystore.properties" >> "$GITHUB_ENV"
          else
            echo "::warning::Using the committed test keystore (sign.keystore). Set KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets for a real release key."
            echo "KEYSTORE_FILE=keystore.properties" >> "$GITHUB_ENV"
          fi

      - name: Write local.properties
        run: |
          SAMPLE_ID=$(grep '^telegram.api_id=' local.properties.sample | cut -d= -f2)
          SAMPLE_HASH=$(grep '^telegram.api_hash=' local.properties.sample | cut -d= -f2)
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          org.gradle.workers.max=$(nproc)
          keystore.file=$KEYSTORE_FILE
          app.id=$APP_ID
          app.name=$APP_NAME
          app.download_url=$APP_DOWNLOAD_URL
          app.sources_url=$APP_SOURCES_URL
          telegram.api_id=${TELEGRAM_API_ID:-$SAMPLE_ID}
          telegram.api_hash=${TELEGRAM_API_HASH:-$SAMPLE_HASH}
          tgx.extension=none
          EOF
          sed 's/api_hash=.*/api_hash=***/' local.properties

      - name: Build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew ${{ inputs.variant || 'assembleLatestArm64Release' }} --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
